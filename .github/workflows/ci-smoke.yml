name: CI Full Smoke

on:
  push:
    branches: [main, fix-facebook-group-composer]
  workflow_dispatch:

jobs:
  full-smoke:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3001
      REDIS_URL: redis://127.0.0.1:6379
      POSTIZ_BASE_URL: http://localhost:4007
      BROWSER_PROFILE_DIR: /tmp/fb-ci-profile
      SCREENSHOT_DIR: /tmp/fb-ci-screens
      LOG_DIR: /tmp/fb-ci-logs
      HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify official Postiz compose bootstrap
        run: bash scripts/verify-postiz-compose.sh

      - name: Start API
        run: |
          npm run dev > /tmp/fb-worker-api.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/fb-worker-api.log
          exit 1

      - name: API health and validation
        run: |
          curl -fsS http://127.0.0.1:3001/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"redis":"PONG"' /tmp/health.json

          STATUS=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -X POST http://127.0.0.1:3001/api/v1/jobs -H 'Content-Type: application/json' -d '{"targetType":"invalid"}')

          cat /tmp/invalid.json
          test "$STATUS" = "400"

      - name: API scheduling and cancellation
        run: |
          node <<'NODE' > /tmp/schedule-payload.json
          const payload = {
            targetType: 'facebook_group',
            targetUrl: 'https://www.facebook.com/groups/123',
            content: 'scheduled',
            scheduledAt: new Date(Date.now() + 3600000).toISOString()
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          curl -fsS -X POST http://127.0.0.1:3001/api/v1/jobs -H 'Content-Type: application/json' --data-binary @/tmp/schedule-payload.json | tee /tmp/scheduled.json
          grep -q '"status":"SCHEDULED"' /tmp/scheduled.json

          JOB_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/scheduled.json','utf8')).id)")
          curl -fsS http://127.0.0.1:3001/api/v1/jobs/$JOB_ID | tee /tmp/state.json
          grep -q '"state":"delayed"' /tmp/state.json

          curl -fsS -X DELETE http://127.0.0.1:3001/api/v1/jobs/$JOB_ID | tee /tmp/cancel.json
          grep -q '"status":"CANCELLED"' /tmp/cancel.json

      - name: Browser smoke
        run: npm run smoke:browser

      - name: Full Postiz Group Media Marketplace Worker E2E
        timeout-minutes: 2
        env:
          BROWSER_PROFILE_DIR: /tmp/fb-full-e2e-profile
          LOG_DIR: /tmp/fb-full-e2e-logs
          SCREENSHOT_DIR: /tmp/fb-full-e2e-screens
        run: npm run smoke:full

      - name: Docker compose validation
        run: |
          cp .env.example .env
          docker compose -f docker-compose.local.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Docker image build
        run: docker build -t schedule-upload-facebook:ci .

      - name: Docker typecheck
        run: docker run --rm schedule-upload-facebook:ci npm run typecheck

      - name: Print API logs
        if: always()
        run: cat /tmp/fb-worker-api.log || true
