x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    REDIS_URL: redis://redis:6379
    HEADLESS: "true"
    BROWSER_PROFILE_DIR: /app/data/browser-profile
    SCREENSHOT_DIR: /app/screenshots
    LOG_DIR: /app/logs
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - browser-profile:/app/data/browser-profile
    - screenshots:/app/screenshots
    - logs:/app/logs

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:3001:3001"

  worker:
    <<: *app
    command: ["npm", "run", "worker"]

volumes:
  redis-data:
  browser-profile:
  screenshots:
  logs:
